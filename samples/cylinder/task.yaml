materials:
  -
    id: 0
    name: MIXTURE
    eof_type: MIX # IDEAL, MIX
regions:
  -
    id: 0
    name: CYLINDER
    cell_type: 0
    material_id: 0
    components:
      - {id: 0, concentration: 0}
      - {id: 1, concentration: 0}
      - {id: 2, concentration: 0}
      - {id: 3, concentration: 1} # O2
      - {id: 4, concentration: 0}
      - {id: 5, concentration: 0}
      - {id: 6, concentration: 0}
    parameters:
      V: {x: 0, y: 0, z: 0}
      T: 300
      P: 101325.0
      G: {x: 0, y: 0, z: 0}
boundaries:
  -
    name: LEFT_WALL
    type: BOUND_WALL_SLIP
  -
    name: LEFT_INLET
    type: BOUND_MASS_FLOW
    parameters:
      CosX: 1.0
      CosY: 0.0
      CosZ: 0.0
      M: 0.00201594
      T: 1500
      P: 101325.0
      components:
        - 0
        - 0
        - 1 # H2
        - 0
        - 0
        - 0
        - 0
  -
    name: WALL
    type: BOUND_WALL_SLIP
  -
    name: RIGHT
    type: BOUND_OUTLET