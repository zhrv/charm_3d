method: CHARM_3D
version: 0.1.2
control:
  FLUX_TYPE: HLLC
  LIMITER: BJ
  MAX_ERROR: 0.01
  REFINE_PERIOD: 10
  REPARTITION_PERIOD: 10
  MIN_LEVEL: 0
  MAX_LEVEL: 1
  CFL: 0.01                    # число Куранта
  TAU: 1.0e-7                 # шаг по времени, используется меньшее значение из этого или из полученного из числа Куранта
  TMAX: 50                    # время, до которго выполняется расчет
  FILE_OUTPUT_STEP: 100 #1      # количество итераций, через которые выполняется вывод результатов в файл
  LOG_OUTPUT_STEP: 10 #1         # интервал вывода краткой информации в лог-файл
  MODEL: {name: EULER, use_visc: 0, use_diffusion: 0, t_ref: 298.15}
mesh:
  files_type: gmsh_msh
  name: cylinder_hex.msh
components:
  - id: 0
    name: H # Hydrogen atomic
    cp_type: CONST
    kp_type: CONST
    ml_type: CONST
    M: 0.00100797                 # молярная масса
    Cp: [ 20700.0 ]               # удельная теплоемкость
    KP0: 0.1                      # теплопроводность вещества при температуре T0
    ML0: 1.2e-06                  # динамическая вязкость вещества при температуре T0
    T0: 1000.0                    # константа для формулы Сазерленда
    TS: 120.0                     # константа для формулы Сазерленда
    Sig: 2.0                      # параметры Леннарда-Джонса
    ek: 30.0                      # параметры Леннарда-Джонса
    h0: 218000.0                  # энтальпия образования вещества
