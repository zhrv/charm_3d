##########################################################
#          !!! ВНИМАНИЕ !!!
#     Параметры для задачи о вихрях Тейлора-Грина
#     Необходимо выполнить сборку приложения с опцией CMake
#      -DTAYLOR_GREEN=ON
##########################################################
method: CHARM_3D
version: 0.1.5
control:
  FLUX_TYPE:              HLLC
  LIMITER:                BJ
  MAX_ERROR:              0.01
  REFINE_PERIOD:          0
  REPARTITION_PERIOD:     0
  MIN_LEVEL:              5
  MAX_LEVEL:              5
  CFL:                    0.1                  # число Куранта
  TAU:                    1.0e-8               # шаг по времени, используется меньшее значение из этого или из полученного из числа Куранта
  TMAX:                   100000              # время, до которго выполняется расчет
  STEP_MAX:               31000
  FILE_OUTPUT_STEP:       100      # количество итераций, через которые выполняется вывод результатов в файл
  LOG_OUTPUT_STEP:        1        # интервал вывода краткой информации в лог-файл
  MODEL:
    name:           NS_JFNK
    use_visc:       0
    use_diffusion:  0
    t_ref:          273.0
    newton: 
      relax:              1.0e-1
      rtol:               1.0e-2
      max_step:           100
      j_eps:              1.0e-9
      solver_rtol:        1.0e-2
      solver_max_step:    50
    # turbulence:
    #   #model: SST
    #   #parameters: { a1: 0.31, sigma_k1: 0.85, sigma_k2: 1.0, sigma_w1: 0.5, sigma_w2: 0.856, beta_star: 0.09, beta_1: 0.075, beta_2: 0.0828, kappa: 0.41}
    #   model: SA
    #   parameters: {sigma: 0.66666667, kappa: 0.41, cb1: 0.1355, cb2: 0.622, cw1: 3.23906782, cw2: 0.3, cw3: 2, cv1: 7.1, ct1: 1, ct2: 2, ct3: 1.2, ct4: 0.5}
    #   # cw1 = cb1/kappa^2 + (1+cb2)/sigma
mesh:
  files_type:   periodic_box
  xmin:         -0.016
  xmax:          0.016
  ymin:         -0.016
  ymax:          0.016
  zmin:         -0.016
  zmax:          0.016
  n:            [1, 1, 1]
components:
  -
    id:       0
    name:     N
    cp_type:  CONST
    kp_type:  CONST
    ml_type:  CONST
    M:        0.0280134          # молярная масса
    Cp:       [1038.810682]      # уд. теплоемкость при пост. давлении
    KP0:      0.0                # теплопроводность вещества при температуре T0
    ML0:      1.67e-005          # динамическая вязкость вещества при температуре T0
    T0:       273.0              # константа для формулы Сазерленда
    TS:       273.0              # константа для формулы Сазерленда
    Sig:      0                  # параметры Леннарда-Джонса
    ek:       0                  # параметры Леннарда-Джонса
    h0:       0                  # энтальпия образования вещества
materials:
  -
    id:       0
    name:     AIR
    eof_type: IDEAL # IDEAL, MIX
regions:
  -
    id:           0
    name:         TAYLOR_GREEN
    cell_type:    0
    material_id:  0
    components:
      - {id: 0, concentration: 1}
    parameters:
      V: {x: 100, y: 0, z: 0}
      T: 273.0
      P: 1.e+5
      G: {x: 0, y: 0, z: 0}
boundaries:
  -
    id:           0
    name:         PERIODIC
    type:         BOUND_PERIODIC
